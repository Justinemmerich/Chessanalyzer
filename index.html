<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chess Analyzer - doubleZZFlav</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 20px; }
    #board { width: 400px; margin: auto; }
    button { margin: 10px; padding: 10px 20px; font-size: 16px; }
    #moveInfo { margin-top: 15px; font-size: 18px; }
    #evalInfo { font-weight: bold; color: darkgreen; margin-top: 5px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/1.0.0/chess.min.js"></script>
  <script src="https://unpkg.com/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stockfish/stockfish.wasm.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
</head>
<body>

  <h1>Chess Analyzer for <code>doubleZZFlav</code></h1>
  <div id="board"></div>

  <div>
    <button onclick="prevMove()">Back</button>
    <button onclick="nextMove()">Next</button>
  </div>

  <div id="moveInfo"></div>
  <div id="evalInfo"></div>

  <script>
    let board = Chessboard('board', { position: 'start' });
    let game = new Chess();
    let moves = [];
    let currentIndex = 0;
    let stockfish = Stockfish();
    let isReady = false;

    stockfish.onmessage = function (event) {
      const line = typeof event === "object" ? event.data : event;
      if (line.includes("bestmove")) {
        const scoreLine = evaluationLine || "Evaluation not found";
        document.getElementById("evalInfo").innerText = scoreLine;
      } else if (line.includes("score")) {
        evaluationLine = parseEval(line);
      }
    };

    let evaluationLine = "";

    function parseEval(line) {
      const match = line.match(/score (cp|mate) ([\-0-9]+)/);
      if (!match) return "";
      if (match[1] === "cp") {
        const centipawns = parseInt(match[2]);
        return `Evaluation: ${(centipawns / 100).toFixed(2)}`;
      } else if (match[1] === "mate") {
        return `Mate in ${match[2]}`;
      }
      return "";
    }

    async function fetchLatestGame() {
      const popupRes = await fetch("https://www.chess.com/callback/user/popup/doubleZZFlav");
      const popupData = await popupRes.json();
      const userId = popupData.userId;

      const gamesRes = await fetch(`https://www.chess.com/callback/user/games?locale=en_US&all=1&userId=${userId}`);
      const gamesData = await gamesRes.json();
      const pgn = gamesData.games[0]?.pgn;

      if (pgn) {
        game.load_pgn(pgn);
        moves = game.history();
        game.reset();
        board.position(game.fen());
      } else {
        alert("Could not load latest game.");
      }
    }

    function evaluatePosition(fen) {
      evaluationLine = "";
      stockfish.postMessage("ucinewgame");
      stockfish.postMessage("isready");
      stockfish.postMessage(`position fen ${fen}`);
      stockfish.postMessage("go depth 12");
    }

    function nextMove() {
      if (currentIndex < moves.length) {
        const move = moves[currentIndex];
        game.move(move);
        board.position(game.fen());
        document.getElementById("moveInfo").innerText = `Move ${currentIndex + 1}: ${move}`;
        evaluatePosition(game.fen());
        currentIndex++;
      }
    }

    function prevMove() {
      if (currentIndex > 0) {
        game.undo();
        currentIndex--;
        board.position(game.fen());
        document.getElementById("moveInfo").innerText = `Move ${currentIndex}: ${moves[currentIndex - 1] || ""}`;
        evaluatePosition(game.fen());
      }
    }

    fetchLatestGame();
  </script>
</body>
</html>
