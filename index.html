<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chess moveList to PGN Converter</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    textarea { width: 100%; height: 100px; margin-top: 10px; }
    pre { background: #f0f0f0; padding: 10px; white-space: pre-wrap; }
    button { margin-top: 10px; padding: 10px 20px; }
  </style>
</head>
<body>
  <h1>Chess moveList to PGN Converter</h1>
  <label for="movelist">Enter moveList:</label>
  <textarea id="movelist">lB2Ugv92cDZRmu5Zpx0KDp70fm!Teg8!kAKCvl3Nbs98acZ9jz6Ldr93feNFAI3Mmf47IRYRsHWOcY09Hs80Y090zHRJHOXOrP76sm6klrLxmDxSrITEIS1SPOFxiyxofoEnpwnEOfEueu2Bwn0TDmBIusks</textarea>
  <button onclick="convertToPGN()">Convert to PGN</button>
  <h2>PGN Output:</h2>
  <pre id="pgnOutput"></pre>

  <!-- Include chess.js library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.13.4/chess.min.js"></script>
  <script>
    // TCN decoding function
    function decodeMoveList(encoded) {
      const T = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!? {~} (^) [_]@#$,./&-*++=";
      const moves = [];
      for (let i = 0; i < encoded.length; i += 2) {
        const fromChar = encoded[i];
        const toChar = encoded[i + 1];
        const fromIndex = T.indexOf(fromChar);
        let toIndex = T.indexOf(toChar);
        const move = {};

        if (fromIndex === -1 || toIndex === -1) continue;

        // Handle promotion
        if (toIndex > 63) {
          const promotionPieces = "qnrbkp";
          move.promotion = promotionPieces[Math.floor((toIndex - 64) / 3)];
          toIndex = fromIndex + (fromIndex < 16 ? -8 : 8) + ((toIndex - 1) % 3) - 1;
        }

        // Handle drops (e.g., in Crazyhouse)
        if (fromIndex > 75) {
          const dropPieces = "qnrbkp";
          move.drop = dropPieces[fromIndex - 79];
        } else {
          move.from = T[fromIndex % 8] + (Math.floor(fromIndex / 8) + 1);
        }

        move.to = T[toIndex % 8] + (Math.floor(toIndex / 8) + 1);
        moves.push(move);
      }
      return moves;
    }

    function convertToPGN() {
      const input = document.getElementById('movelist').value.trim();
      const decodedMoves = decodeMoveList(input);
      const chess = new Chess();
      for (const move of decodedMoves) {
        const result = chess.move(move);
        if (!result) {
          alert('Invalid move encountered. Conversion stopped.');
          break;
        }
      }
      document.getElementById('pgnOutput').textContent = chess.pgn();
    }
  </script>
</body>
</html>
