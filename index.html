<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chess Game Evaluator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/1.0.0/chess.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mliebelt/pgn-parser@1.3.4/dist/pgn-parser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stockfish/stockfish.js"></script>
  <style>
    body { font-family: sans-serif; background: #f0f0f0; padding: 20px; }
    #board { max-width: 400px; margin-bottom: 20px; }
    .move { margin: 5px 0; }
  </style>
</head>
<body>
  <h2>Chess Game Evaluator</h2>
  <div id="status">Loading...</div>
  <div id="moves"></div>

  <script>
    const userIdUrl = "https://www.chess.com/callback/user/popup/doubleZZFlav";
    const gamesUrlBase = "https://www.chess.com/callback/user/games?locale=en_US&all=1&userId=";

    const stockfish = Stockfish();
    stockfish.onmessage = (event) => {
      if (typeof event === "string" && event.startsWith("info depth")) {
        const match = event.match(/score cp (-?\d+)/);
        if (match && currentEvalCallback) {
          const score = parseInt(match[1], 10) / 100;
          currentEvalCallback(score);
          currentEvalCallback = null;
        }
      }
    };

    let currentEvalCallback = null;

    async function fetchLatestGame() {
      const userData = await fetch(userIdUrl).then(res => res.json());
      const userId = userData?.id;
      if (!userId) return document.getElementById("status").innerText = "User ID not found";

      const gamesData = await fetch(gamesUrlBase + userId).then(res => res.json());
      const latestGame = gamesData?.games?.[0];
      if (!latestGame) return document.getElementById("status").innerText = "No games found";

      const pgn = latestGame.pgn;
      analyzePGN(pgn);
    }

    function analyzePGN(pgn) {
      const parsed = pgnParser.parse(pgn)[0];
      const game = new Chess();
      const moves = parsed.moves.map(move => move.move);

      const movesDiv = document.getElementById("moves");
      document.getElementById("status").innerText = "Analyzing moves...";

      let index = 0;

      function evalNextMove() {
        if (index >= moves.length) {
          document.getElementById("status").innerText = "Done analyzing.";
          return;
        }

        const move = moves[index];
        const moveResult = game.move(move);

        if (!moveResult) {
          console.log("Illegal move:", move);
          index++;
          evalNextMove();
          return;
        }

        const fen = game.fen();
        stockfish.postMessage("position fen " + fen);
        stockfish.postMessage("go depth 15");

        currentEvalCallback = (score) => {
          const moveEl = document.createElement("div");
          moveEl.className = "move";
          moveEl.innerText = `${index + 1}. ${move} (Eval: ${score})`;
          movesDiv.appendChild(moveEl);
          index++;
          setTimeout(evalNextMove, 300); // Delay to avoid freezing UI
        };
      }

      evalNextMove();
    }

    fetchLatestGame();
  </script>
</body>
</html>
